import java.util.stream.Collectors

plugins {
    id "java"
    id "maven-publish"
    id "org.jetbrains.kotlin.jvm" version "1.6.10"
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

group "gg.scala.recorder"
version "0.0.0.1"

repositories {
    mavenCentral()
    mavenLocal()

    maven {
        name "Scala"
        allowInsecureProtocol true
        url "http://repository.scala.gg/repository/maven-releases/"

        credentials {
            username property("scala.credentials.username") as String
            password property("scala.credentials.password") as String
        }
    }

    maven { url "https://jitpack.io" }
    maven { url "https://papermc.io/repo/repository/maven-public/" }
}

dependencies {
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:1.6.10"

    implementation "me.lucko:helper:5.6.9.1"
    annotationProcessor "me.lucko:helper:5.6.9.1"

    compileOnly "org.projectlombok:lombok:1.18.22"
    annotationProcessor "org.projectlombok:lombok:1.18.22"

    compileOnly fileTree("lib")

    compileOnly "gg.scala.spigot:sspigot-server:1.0.7"
    compileOnly "gg.scala.lemon:bukkit:1.1.0"

    compileOnly 'net.evilblock.cubed:bukkit:1.3.4@jar'

    compileOnly 'gg.scala.store:spigot:0.1.0'
    compileOnly 'gg.scala.store:shared:0.1.0'
}

compileJava {
    options.compilerArgs += ["-parameters"]

    options.fork = true
    options.forkOptions.executable = "javac"
    options.encoding = "UTF-8"
}

sourceCompatibility = 1.8
targetCompatibility = 1.8

compileKotlin {
    kotlinOptions.javaParameters = true
    kotlinOptions.jvmTarget = "1.8"
}

shadowJar {
    archiveClassifier.set("")

    exclude "**/*.kotlin_metadata"
    exclude "**/*.kotlin_builtins"
    exclude "META-INF/"

    archiveFileName = "practice.jar"
}

tasks.withType(GenerateMavenPom).all {
    doLast {
        final File file = new File(
                "$buildDir/publications/shadow/pom-default.xml"
        )

        final BufferedReader br = new BufferedReader(
                new FileReader(file)

        )
        final String lines = br.lines()
                .map((line) -> {
                    if (line.contains("<dependencies/>")) "" else line
                })
                .collect(Collectors.joining("\n"))

        final BufferedWriter wr = new BufferedWriter(
                new FileWriter(file, true)
        )

        final PrintWriter writer = new PrintWriter(file)
        writer.print("")
        writer.close()

        wr.write(lines)
        wr.close()
    }
}

publishing {
    publications {
        shadow(MavenPublication) { publication ->
            project.shadow.component(publication)
        }
    }

    repositories {
        maven {
            name "Scala"
            allowInsecureProtocol true
            url "http://repository.scala.gg/repository/maven-releases/"

            credentials {
                username property("scala.credentials.username") as String
                password property("scala.credentials.password") as String
            }
        }
    }
}

tasks.build.dependsOn(shadowJar, publishShadowPublicationToScalaRepository)
