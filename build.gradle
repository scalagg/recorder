plugins {
    id "maven-publish"
    id "io.freefair.lombok" version "5.3.0"
    id "com.jfrog.artifactory" version "4.28.2"
    id "org.jetbrains.kotlin.jvm" version "1.6.21"
    id "org.jetbrains.kotlin.kapt" version "1.6.21"
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

group "gg.scala.recorder"
version "1.0.0-development"

repositories {
    mavenCentral()
    mavenLocal()

    maven {
        name "scala"
        url "${artifactory_contextUrl}/${artifactory_release}"
        credentials {
            username "${artifactory_user}"
            password "${artifactory_password}"
        }
    }

    maven { url "https://jitpack.io" }
    maven { url "https://ci.athion.net/job/FastAsyncWorldEdit/ws/mvn/" }
    maven { url "https://papermc.io/repo/repository/maven-public/" }
}

dependencies {
    compileOnly "org.projectlombok:lombok:1.18.24"
    annotationProcessor "org.projectlombok:lombok:1.18.24"

    compileOnly "gg.scala.commons:bukkit:2.0.0"
    kapt "me.lucko:helper:5.6.10.1"

    compileOnly fileTree("lib")
    compileOnly "gg.scala.spigot:sspigot-server:1.0.7"

    compileOnly "gg.scala.lemon:bukkit:1.2.1"
    compileOnly "gg.scala.cloudsync:spigot:1.0.1"

    compileOnly "com.comphenix.protocol:ProtocolLib:4.7.0"

    compileOnly "gg.scala.store:spigot:0.1.3"
    compileOnly "gg.scala.store:shared:0.1.3"
}

kapt {
    keepJavacAnnotationProcessors = true
}

compileJava {
    options.compilerArgs += ["-parameters"]

    options.fork = true
    options.forkOptions.executable = "javac"
    options.encoding = "UTF-8"
}

compileKotlin {
    kotlinOptions.javaParameters = true
    kotlinOptions.jvmTarget = "1.8"
}

shadowJar {
    archiveClassifier.set("")

    exclude "**/*.kotlin_metadata"
    exclude "**/*.kotlin_builtins"
    exclude "META-INF/"

    archiveFileName = "recorder.jar"
}

publishing {
    publications {
        shadow(MavenPublication) { publication ->
            project.shadow.component(publication)
        }
    }

    repositories {
        maven {
            name "scala"
            url "${artifactory_contextUrl}/${artifactory_release}"
            credentials {
                username "${artifactory_user}"
                password "${artifactory_password}"
            }
        }
    }
}

artifactory {
    this.contextUrl = "${artifactory_contextUrl}"

    publish {
        repository {
            repoKey = "${artifactory_release_local}"
            username = "${artifactory_user}"
            password = "${artifactory_password}"
            maven = true
        }
    }
}

tasks.build.dependsOn(
    shadowJar,
    publishShadowPublicationToScalaRepository
)
